version: 1

dataset: tpch_sf1
description: >
  Semantic model for the TPCH_SF1 schema in SNOWFLAKE_SAMPLE_DATA. Defines
  tables, measures, dimensions, and relationships to support NL→SQL over
  sales, customers, products, suppliers, and geography.

tables:
  customer:
    type: dimension
    primary_key: c_custkey
    description: Customer master data.
    columns:
      c_custkey:
        role: key
        description: Customer surrogate key.
      c_name:
        role: attribute
        description: Customer name.
        synonyms: [customer_name, name, client]
      c_address:
        role: attribute
        description: Customer street address.
      c_nationkey:
        role: foreign_key
        references: nation.n_nationkey
        description: Link to customer nation.
      c_phone:
        role: attribute
      c_acctbal:
        role: numeric
        description: Customer account balance.
      c_mktsegment:
        role: attribute
        description: Marketing segment of the customer.
        synonyms: [segment, market_segment]
      c_comment:
        role: attribute

  orders:
    type: fact_header
    primary_key: o_orderkey
    description: >
      Order header table: one row per order, with order date, priority,
      customer, and overall comment.
    columns:
      o_orderkey:
        role: key
        description: Order key.
      o_custkey:
        role: foreign_key
        references: customer.c_custkey
        description: Customer placing the order.
      o_orderstatus:
        role: attribute
        description: Order status flag.
      o_totalprice:
        role: numeric
        description: Header-level total order price.
        semantic_hint: order_amount
      o_orderdate:
        role: date
        description: Order entry date.
        synonyms: [order_date, transaction_date, date]
      o_orderpriority:
        role: attribute
      o_clerk:
        role: attribute
      o_shippriority:
        role: attribute
      o_comment:
        role: attribute

  lineitem:
    type: fact
    primary_key: [l_orderkey, l_linenumber]
    description: >
      Transaction-level line items. This is the main fact table for sales,
      quantity, discount, and tax analysis.
    columns:
      l_orderkey:
        role: foreign_key
        references: orders.o_orderkey
        description: Header order key.
      l_partkey:
        role: foreign_key
        references: part.p_partkey
      l_suppkey:
        role: foreign_key
        references: supplier.s_suppkey
      l_linenumber:
        role: attribute
      l_quantity:
        role: numeric
        description: Ordered quantity.
        semantic_hint: quantity
      l_extendedprice:
        role: numeric
        description: Extended line price before discount.
        semantic_hint: gross_line_amount
      l_discount:
        role: numeric
        description: Discount rate (fraction).
        semantic_hint: discount_rate
      l_tax:
        role: numeric
      l_returnflag:
        role: attribute
      l_linestatus:
        role: attribute
      l_shipdate:
        role: date
        description: Ship date.
        synonyms: [shipping_date]
      l_commitdate:
        role: date
      l_receiptdate:
        role: date
      l_shipinstruct:
        role: attribute
      l_shipmode:
        role: attribute
      l_comment:
        role: attribute

  part:
    type: dimension
    primary_key: p_partkey
    description: Product / part master.
    columns:
      p_partkey:
        role: key
      p_name:
        role: attribute
        description: Part name.
        synonyms: [product_name, item_name]
      p_mfgr:
        role: attribute
        description: Manufacturer identifier.
      p_brand:
        role: attribute
        description: Brand.
      p_type:
        role: attribute
        description: Product type.
      p_size:
        role: attribute
        description: Part size.
      p_container:
        role: attribute
        description: Packaging / container type.
      p_retailprice:
        role: numeric
        description: Suggested retail price.
      p_comment:
        role: attribute

  partsupp:
    type: bridge
    primary_key: [ps_partkey, ps_suppkey]
    description: Part–supplier bridge with availability and cost info.
    columns:
      ps_partkey:
        role: foreign_key
        references: part.p_partkey
      ps_suppkey:
        role: foreign_key
        references: supplier.s_suppkey
      ps_availqty:
        role: numeric
        description: Available quantity.
      ps_supplycost:
        role: numeric
        description: Supplier cost for the part.
      ps_comment:
        role: attribute

  supplier:
    type: dimension
    primary_key: s_suppkey
    description: Supplier master data.
    columns:
      s_suppkey:
        role: key
      s_name:
        role: attribute
        description: Supplier name.
        synonyms: [vendor_name, supplier_name]
      s_address:
        role: attribute
      s_nationkey:
        role: foreign_key
        references: nation.n_nationkey
      s_phone:
        role: attribute
      s_acctbal:
        role: numeric
      s_comment:
        role: attribute

  nation:
    type: dimension
    primary_key: n_nationkey
    description: Nation / country dimension.
    columns:
      n_nationkey:
        role: key
      n_name:
        role: attribute
        description: Nation / country name.
        synonyms: [country, country_name]
      n_regionkey:
        role: foreign_key
        references: region.r_regionkey
      n_comment:
        role: attribute

  region:
    type: dimension
    primary_key: r_regionkey
    description: Region dimension.
    columns:
      r_regionkey:
        role: key
      r_name:
        role: attribute
        description: Region name.
        synonyms: [geographic_region, region_name]
      r_comment:
        role: attribute

measures:
  revenue:
    expression: "SUM(l_extendedprice * (1 - l_discount))"
    table: lineitem
    description: Net sales revenue after discount at line level.
    synonyms: [sales, net_sales, turnover, sales_revenue]

  gross_sales:
    expression: "SUM(l_extendedprice)"
    table: lineitem
    description: Gross sales before discount.
    synonyms: [gross_revenue]

  order_count:
    expression: "COUNT(DISTINCT o_orderkey)"
    table: orders
    description: Number of distinct orders.
    synonyms: [transactions, num_orders, order_volume]

  avg_discount:
    expression: "AVG(l_discount)"
    table: lineitem
    description: Average discount rate across line items.
    synonyms: [average_discount]

  quantity_sold:
    expression: "SUM(l_quantity)"
    table: lineitem
    description: Total quantity sold.
    synonyms: [volume, units_sold]

  average_order_size:
    expression: "SUM(l_quantity) / COUNT(DISTINCT l_orderkey)"
    table: lineitem
    description: "Average quantity per order."
    synonyms: ["average order", "avg order size", "average order size", "avg size"]

  average_quantity:
    expression: "AVG(l_quantity)"
    table: lineitem
    description: "Average quantity per line item."
    synonyms: ["avg quantity", "average quantity", "avg qty"]

  average_revenue:
    expression: "AVG(l_extendedprice * (1 - l_discount))"
    table: lineitem
    description: "Average revenue per line item."
    synonyms: ["average revenue", "avg revenue"]

  profit:
    expression: "SUM(l_extendedprice * (1 - l_discount) - ps_supplycost * l_quantity)"
    table: lineitem
    description: "Profit at line level."
    synonyms: ["margin", "profit", "gross_profit", "gm"]

  profit_margin_pct:
    expression: "SUM(l_extendedprice * (1 - l_discount) - ps_supplycost * l_quantity)
                / SUM(l_extendedprice * (1 - l_discount))"
    table: lineitem
    description: "Profit margin percentage."
    synonyms: ["margin percent", "profit percentage", "margin rate", "gm percent", "gross margin"]

  discount_amount:
    expression: "SUM(l_extendedprice * l_discount)"
    table: lineitem
    description: "Total discount amount."
    synonyms: ["discount dollars", "discount value", "total discount"]

  average_order_value:
    expression: "SUM(l_extendedprice * (1 - l_discount)) / COUNT(DISTINCT l_orderkey)"
    table: lineitem
    description: "Average revenue per order."
    synonyms: ["aov", "avg order value", "order value", "average basket value"]

  customer_count:
    expression: "COUNT(DISTINCT c_custkey)"
    table: customer
    description: "Number of unique customers."
    synonyms: ["unique customers", "customer volume", "num_customers"]

  supplier_count:
    expression: "COUNT(DISTINCT s_suppkey)"
    table: supplier
    description: "Unique supplier count."
    synonyms: ["num suppliers", "supplier volume"]

  arpc:
    expression: "SUM(l_extendedprice * (1 - l_discount)) / COUNT(DISTINCT c_custkey)"
    table: lineitem
    description: "Average revenue per customer."
    synonyms: ["avg revenue per customer", "arpc", "customer revenue"]

  line_count:
    expression: "COUNT(*)"
    table: lineitem
    description: "Number of line items."
    synonyms: ["lines", "detail lines", "item lines"]

  average_lines_per_order:
    expression: "COUNT(*) / COUNT(DISTINCT l_orderkey)"
    table: lineitem
    description: "Average number of lines per order."
    synonyms: ["avg lines per order", "line density"]


dimensions:
  order_date:
    table: orders
    column: o_orderdate
    description: Order entry date.
    time_grains: [day, month, quarter, year]
    synonyms: [date, transaction_date, order_day]

  ship_date:
    table: lineitem
    column: l_shipdate
    description: Shipment date.
    time_grains: [day, month, quarter, year]
    synonyms: [shipping_date]

  customer_name:
    table: customer
    column: c_name
    description: Customer name.
    synonyms: [customer, client, buyer, purchaser]

  customer_segment:
    table: customer
    column: c_mktsegment
    description: Customer marketing segment.
    synonyms: [segment, market_segment]

  region_name:
    table: region
    column: r_name
    description: Region name.
    synonyms: [region, geographic_region]

  nation_name:
    table: nation
    column: n_name
    description: Nation / country name.
    synonyms: [country, country_name]

  supplier_name:
    table: supplier
    column: s_name
    description: Supplier name.
    synonyms: [vendor, supplier]

  part_name:
    table: part
    column: p_name
    description: Part / product name.
    synonyms: [product, sku, item, product_name, item_name, sku_name,product name, item name, sku name]

  product_brand:
    table: part
    column: p_brand
    description: Product brand
    synonyms: ["brand", "product_brand", "brand_name"]

relationships:
  - from: orders.o_custkey
    to: customer.c_custkey
    type: many_to_one
    role: customer_hierarchy
    description: Each order belongs to a single customer.

  - from: lineitem.l_orderkey
    to: orders.o_orderkey
    type: many_to_one
    role: order
    description: Each line item belongs to a single order.

  - from: orders.o_orderkey
    to: lineitem.l_orderkey
    type: one_to_many
    role: order
    description: Orders have multiple line items.

  - from: customer.c_nationkey
    to: nation.n_nationkey
    type: many_to_one
    role: customer_hierarchy
    description: Each customer is associated with a nation.

  - from: supplier.s_nationkey
    to: nation.n_nationkey
    type: many_to_one
    role: supplier_hierarchy
    description: Each supplier is associated with a nation.

  - from: nation.n_regionkey
    to: region.r_regionkey
    type: many_to_one
    role: customer_hierarchy   # we prefer customer-hierarchy for "region"
    description: Each nation is associated with a region.

  - from: lineitem.l_partkey
    to: part.p_partkey
    type: many_to_one
    role: product_hierarchy
    description: Line items reference a specific part.

  # - from: lineitem.l_suppkey
  #   to: supplier.s_suppkey
  #   type: many_to_one
  #   role: supplier_hierarchy
  #   description: Line items reference a specific supplier.

  # - from: partsupp.ps_partkey
  #   to: part.p_partkey
  #   type: many_to_one
  #   role: product_hierarchy
  #   description: Part–supplier cost mapping for each part.

  - from: partsupp.ps_suppkey
    to: supplier.s_suppkey
    type: many_to_one
    role: supplier_hierarchy
    description: Part–supplier cost mapping for each supplier.

  # Lineitem → Partsupp based on partkey and suppkey composite foreign key
  # - from: "lineitem.l_partkey, lineitem.l_suppkey"
  #   to: "partsupp.ps_partkey, partsupp.ps_suppkey"
  #   type: many_to_one
  #   role: product_hierarchy
  #   description: Correct TPC-H composite join between lineitem and partsupp.

  # Explanation of the two separate relationships for composite key join:
  # ✔️ Two separate relationships
  # ✔️ Same source table (lineitem)
  # ✔️ Same target table (partsupp)
  # ✔️ Different source columns
  # ✔️ Different target columns
  # ✔️ SQL builder will detect they share the same pair of tables
  # ✔️ SQL builder will merge them into one ON clause with AND

  # Lineitem → Partsupp based on partkey  
  - from: lineitem.l_partkey
    to: partsupp.ps_partkey
    type: many_to_one
    role: product_hierarchy
    description: Join on part key to reach part-supplier cost mapping.

  # Lineitem → Partsupp based on suppkey  
  - from: lineitem.l_suppkey
    to: partsupp.ps_suppkey
    type: many_to_one
    role: supplier_hierarchy
    description: Join on supplier key to reach part-supplier cost mapping.


# Declare explicit column → table mapping in YAML to help with ambiguous columns
columns:
  # lineitem
  l_orderkey: lineitem
  l_partkey: lineitem
  l_suppkey: lineitem
  l_quantity: lineitem
  l_extendedprice: lineitem
  l_discount: lineitem

  # orders
  o_orderkey: orders
  o_custkey: orders
  o_orderdate: orders

  # partsupp
  ps_partkey: partsupp
  ps_suppkey: partsupp
  ps_supplycost: partsupp
  ps_availqty: partsupp

  # part
  p_partkey: part
  p_name: part
  p_brand: part

  # supplier
  s_suppkey: supplier
  s_nationkey: supplier
  s_name: supplier

  # customer
  c_custkey: customer
  c_nationkey: customer
  c_name: customer

  # nation
  n_nationkey: nation
  n_regionkey: nation

  # region
  r_regionkey: region
  r_name: region


